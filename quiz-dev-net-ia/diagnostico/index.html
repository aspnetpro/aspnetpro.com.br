<script>
(function () {
  var C = window.DiagnosticoConteudo;
  var core = window.DiagnosticoCore;
  var raiz = document.getElementById('resultado');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function externo(href) { return /^https?:\/\/(?!aspnetpro\.com\.br)/.test(href); }
  // destino: valor de data-select-item (track.js dispara select_item no clique).
  function link(cta, classe, destino) {
    return '<a' + (classe ? ' class="' + classe + '"' : '') + ' href="' + esc(cta.href) + '"' +
      (externo(cta.href) ? ' target="_blank" rel="noopener"' : '') +
      (destino ? ' data-select-item="' + esc(destino) + '" data-list="diagnostico"' : '') +
      '>' + esc(cta.texto) + '</a>';
  }

  function telaSemResultado() {
    var s = C.SEM_RESULTADO;
    return '<section class="vazio">' +
      '<p class="label">' + esc(s.rotulo) + '</p>' +
      '<h1>' + esc(s.titulo) + '</h1>' +
      '<p class="texto">' + esc(s.texto) + '</p>' +
      '<div class="ctas">' + link(s.cta, 'ui-btn ui-btn--primary ui-btn--lg') + '</div>' +
      (s.secundario ? '<p class="secundario">' + link(s.secundario, '', 'workshop') + '</p>' : '') +
      '</section>';
  }

  function telaResultado(t) {
    var o = t.oferta;
    var h = '<section><p class="label">' + esc(t.rotulo) + '</p>' +
      '<h1>' + esc(t.titulo) + '</h1>' +
      '<p class="perfil-texto">' + esc(t.texto) + '</p>' +
      (t.inconsistencia ? '<p class="nota-neutra">' + esc(t.inconsistencia.texto) + ' ' + link(t.inconsistencia.link) + '</p>' : '') +
      '</section>';

    if (t.alerta || t.avisoTestes) {
      h += '<section class="block">';
      if (t.alerta) {
        h += '<div class="alerta" role="note"><p class="label">' + esc(t.alerta.rotulo) + '</p><ul>' +
          t.alerta.itens.map(function (i) { return '<li><span aria-hidden="true">✕</span>' + esc(i) + '</li>'; }).join('') +
          '</ul></div>';
      }
      if (t.avisoTestes) h += '<p class="aviso"><span>// testes ›</span> ' + esc(t.avisoTestes) + '</p>';
      h += '</section>';
    }

    if (t.blocos) {
      var b = t.blocos;
      var fraco = b.ganho ? b.ganho.nome : null;
      h += '<section class="block"><p class="label">' + esc(b.rotulo) + '</p><ul class="barras">' +
        b.lista.map(function (x) {
          return '<li' + (x.nome === fraco ? ' class="barra-fraca"' : '') + '>' +
            '<div class="barra-topo"><span>' + esc(x.nome) + '</span><span class="barra-estado">' + esc(x.estado) + '</span></div>' +
            '<div class="barra" role="img" aria-label="' + esc(x.nome + ': ' + x.estado) + '"><i style="width:' + Math.max(4, x.pct) + '%"></i></div></li>';
        }).join('') + '</ul>';
      if (b.ganho) {
        h += '<div class="ganho"><p class="label">' + esc(b.rotuloGanho) + '</p>' +
          '<h2>' + esc(b.ganho.nome) + '</h2>' +
          '<p>' + esc(b.ganho.frase) + '</p>' +
          '<p class="acao"><span>› </span>' + esc(b.ganho.acao) + '</p></div>';
      }
      h += '</section>';
    }

    if (t.dor) {
      h += '<section class="block"><p class="label">' + esc(t.rotuloDor) + '</p>' +
        '<p class="dor-texto">' + esc(t.dor) + '</p></section>';
    }

    h += '<section class="block"><p class="label">' + esc(t.rotuloOferta) + '</p>' +
      '<div class="oferta">' +
      '<p class="oferta-produto">' + esc(o.titulo) + '</p>' +
      '<h2>' + esc(o.convite || o.titulo) + '</h2>' +
      '<p class="oferta-texto">' + esc(o.texto) + '</p>' +
      (o.extras || []).map(function (x) { return '<p class="oferta-extra">' + esc(x) + '</p>'; }).join('') +
      (o.passos && o.passos.length ? '<ul class="oferta-passos">' + o.passos.map(function (p) { return '<li><span aria-hidden="true">›</span>' + esc(p) + '</li>'; }).join('') + '</ul>' : '') +
      '<p class="oferta-mono">' + esc(o.linhaMono) + '</p>' +
      '<p class="oferta-nota">' + esc(o.nota) + '</p>' +
      '<div class="ctas">' + link(o.cta, 'ui-btn ui-btn--primary ui-btn--lg', o.cta.destino) + '</div>' +
      (o.secundario ? '<p class="secundario">' + link(o.secundario, '', o.secundario.destino) + '</p>' : '') +
      '</div></section>';

    // Compartilhar fica como link de texto: não pode competir com o CTA da oferta.
    h += '<section class="block compartilhar"><p class="label">// compartilhe</p>' +
      '<p class="compartilhar-texto">Conhece um dev .NET que usa IA no dia a dia? <a id="compartilhar-linkedin" href="' + esc(urlLinkedIn(t.perfilId)) + '" target="_blank" rel="noopener">Mande o quiz pra ele pelo LinkedIn →</a></p>' +
      '<p class="compartilhar-nota" id="compartilhar-nota" hidden>Texto copiado. Cole no post do LinkedIn.</p>' +
      '</section>';
    return h;
  }

  // Compartilha o quiz, nunca o resultado: a URL do resultado carrega a pontuação.
  var URL_QUIZ = 'https://aspnetpro.com.br/quiz-dev-net-ia/';
  function urlLinkedIn(perfilId) {
    var alvo = URL_QUIZ + '?utm_source=linkedin&utm_medium=compartilhar&utm_campaign=dev-net-ia-dez26&utm_content=' + encodeURIComponent(perfilId);
    return 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(alvo);
  }

  var r = core.analisar(window.location.search);

  if (r.valido) r.tela.perfilId = r.perfil.id;
  raiz.innerHTML = r.valido ? telaResultado(r.tela) : telaSemResultado();

  // O LinkedIn não aceita texto pronto no link de compartilhar: copia uma sugestão para o aluno colar.
  var btn = document.getElementById('compartilhar-linkedin');
  if (btn) {
    btn.addEventListener('click', function () {
      var texto = 'Fiz o quiz de engenharia agêntica da ASP .NET PRO e deu ' + r.perfil.nome + '. São 16 perguntas sobre como você conduz o agente no dia a dia. Qual é o seu?';
      try {
        if (navigator.clipboard) navigator.clipboard.writeText(texto).then(function () {
          var nota = document.getElementById('compartilhar-nota');
          if (nota) nota.hidden = false;
        }, function () {});
      } catch (e) {}
      if (window.aspnetproTrack) window.aspnetproTrack.event('share', { method: 'linkedin', content_type: 'quiz', item_id: r.perfil.id });
    });
  }

  // Nunca envia pontos, blocos, projeto nem sid.
  if (window.aspnetproTrack) {
    window.aspnetproTrack.event('diagnostico_resultado', {
      perfil: r.valido ? r.perfil.id : 'nenhum',
      destino: r.valido ? r.destino : 'nenhum',
      parametros_validos: r.valido
    });
  }
})();
</script>
