<script>
(function () {
  var C = window.DiagnosticoConteudo;
  var core = window.DiagnosticoCore;
  var raiz = document.getElementById('resultado');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function externo(href) { return /^https?:\/\/(?!aspnetpro\.com\.br)/.test(href); }
  function link(cta, classe) {
    var ext = externo(cta.href);
    return '<a class="ui-btn ' + classe + '" href="' + esc(cta.href) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + esc(cta.texto) + '</a>';
  }

  function telaSemResultado() {
    var s = C.SEM_RESULTADO;
    return '<section class="vazio">' +
      '<p class="label">' + esc(s.rotulo) + '</p>' +
      '<h1>' + esc(s.titulo) + '</h1>' +
      '<p class="texto">' + esc(s.texto) + '</p>' +
      '<div class="ctas">' + link(s.cta1, 'ui-btn--primary ui-btn--lg') + link(s.cta2, 'ui-btn--ghost ui-btn--lg') + '</div>' +
      '</section>';
  }

  function telaResultado(r) {
    var h = '';
    if (r.alerta) {
      h += '<section class="alerta" role="alert"><p class="label">' + esc(C.ALERTA.rotulo) + '</p>' +
        '<h2>' + esc(C.ALERTA.titulo) + '</h2><p>' + esc(C.ALERTA.texto) + '</p></section>';
    }
    h += '<section><p class="label">// seu resultado</p>' +
      '<h1>' + esc(r.perfil.nome) + '</h1>' +
      '<p class="frase">' + esc(r.perfil.frase) + '</p>' +
      '<p class="score">' + r.p + '<small>/36</small></p>' +
      '<p class="perfil-texto">' + esc(r.perfil.paragrafo) + '</p></section>';

    h += '<section class="block"><p class="label">// radar das 6 dimensões</p><div class="radar-box">' +
      core.radarSvg(r.notas, r.gargalo) + '<ul class="notas">' +
      C.DIMENSOES.map(function (d) {
        var g = r.gargalo && r.gargalo.chave === d.chave;
        return '<li' + (g ? ' class="is-gargalo"' : '') + '><span>' + esc(d.nome) + '</span><b>' + r.notas[d.chave] + '/6</b></li>';
      }).join('') + '</ul></div></section>';

    h += '<section class="block"><div class="gargalo"><p class="label">// seu gargalo</p>';
    if (r.gargalo) {
      var g = C.GARGALOS[r.gargalo.chave];
      h += '<h2>' + esc(g.titulo) + '</h2><p class="dica">' + esc(g.dica) + '</p>' +
        '<p class="no-kit"><span>&gt;_</span> No kit: ' + esc(g.kit) + '</p>';
    } else {
      h += '<h2>' + esc(C.SEM_GARGALO.titulo) + '</h2><p class="dica">' + esc(C.SEM_GARGALO.texto) + '</p>';
    }
    h += '</div></section>';

    h += '<section class="block"><p class="label">// próximo passo</p>' +
      '<div class="ctas">' + link({ texto: 'Quero o kit →', href: C.kitUrl(r.gargalo && r.gargalo.chave) }, 'ui-btn--primary ui-btn--lg') + link(r.perfil.cta2, 'ui-btn--ghost ui-btn--lg') + '</div>' +
      '<p class="kit-nota">' + esc(r.perfil.kit) + '</p></section>';

    // O LinkedIn ignora texto pré-preenchido: o botão abre o link do quiz e o texto vai para a área de transferência.
    var linkedin = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(C.LINKS.quiz);
    h += '<section class="block"><p class="label">// compartilhar</p>' +
      '<p class="muted">Desafie o seu time a fazer o diagnóstico também.</p>' +
      '<div class="share">' +
      '<a class="ui-btn ui-btn--ghost" id="share-linkedin" href="' + esc(linkedin) + '" target="_blank" rel="noopener">Compartilhar no LinkedIn ›</a>' +
      '<button type="button" class="ui-btn ui-btn--ghost" id="share-copy">Copiar texto</button>' +
      '<span class="share-status" id="share-status" role="status"></span></div></section>';
    return h;
  }

  function copiar(texto) {
    var status = document.getElementById('share-status');
    function ok() { status.textContent = '✓ texto copiado'; }
    function falha() { status.textContent = 'não deu para copiar'; }
    try {
      navigator.clipboard.writeText(texto).then(ok, falha);
    } catch (e) { falha(); }
  }

  var r = core.analisar(window.location.search);

  raiz.innerHTML = r.valido ? telaResultado(r) : telaSemResultado();

  if (r.valido) {
    var texto = C.textoCompartilhar(r.perfil.nome);
    document.getElementById('share-copy').addEventListener('click', function () { copiar(texto); });
    document.getElementById('share-linkedin').addEventListener('click', function () { copiar(texto); });
  }

  // RN07: nunca envia o sid nem as notas individuais.
  if (window.aspnetproTrack) {
    window.aspnetproTrack.event('diagnostico_resultado', {
      perfil: r.valido ? r.perfil.id : 'nenhum',
      gargalo: r.valido && r.gargalo ? r.gargalo.chave : 'nenhum',
      alerta: r.valido ? r.alerta : false,
      parametros_validos: r.valido
    });
  }
})();
</script>
